<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeClass - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="#" class="logo">We<span>Class</span></a>
        
        <div class="user-menu">
            <div class="avatar-btn" id="avatarBtn">U</div>
            
            <div class="dropdown-content" id="userDropdown">
                <div class="user-info">
                    <strong id="userEmailDisplay">user@gmail.com</strong>
                    <div class="user-email">Tài khoản giáo viên</div>
                </div>
                
                <button class="menu-item" onclick="toggleTheme()">
                    <span id="themeText">Chế độ Tối 🌙</span>
                </button>
                
                <button id="btnLogout" class="menu-item" style="color: #e11d48;">
                    Đăng xuất 👋
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Danh sách lớp -->
        <div id="class-section">
            <div class="card" style="margin-bottom: 2rem; padding: 2rem;">
                <h2>Chào bạn! 👋</h2>
                <div style="display: flex; gap: 10px; width: 100%; max-width: 500px;">
                    <input type="text" id="className" placeholder="Tên lớp mới học...">
                    <button id="btnAddClass" style="width: auto;">Tạo</button>
                </div>
            </div>
            <div id="class-list" class="grid"></div>
        </div>

        <!-- Chi tiết lớp -->
        <div id="student-section" class="hidden">
            <button onclick="showClasses()" style="width: auto; margin-bottom: 1rem; background: var(--border); color: var(--text-main);">← Trở về</button>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="card">
                    <h2 id="current-class-title">Lớp học</h2>
                    <div id="random-result" style="font-size: 1.5rem; color: var(--primary); font-weight: 800;">🎲 ???</div>
                    <button id="btnRandom">Gọi tên ngẫu nhiên</button>
                    <hr style="width: 100%; border: 0; border-top: 1px solid var(--border);">
                    <input type="text" id="stName" placeholder="Tên học sinh">
                    <input type="text" id="stNumber" placeholder="STT">
                    <button id="btnAddStudent">Thêm học sinh</button>
                </div>
                <div class="card">
                    <h3>Danh sách lớp</h3>
                    <div id="student-list" style="width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
