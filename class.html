<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - WeClass</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="index.html" class="logo">We<span>Class</span></a>
            <div class="nav-links">
                <a href="tkb.html">Thời khóa biểu</a>
                <a href="class.html" class="active">Lớp học</a>
                <a href="index.html">Giới thiệu</a>
                <div class="dropdown-tools">
                    <button class="tools-btn" type="button">Công cụ </button>
                    <div class="tools-menu">
                        <button class="menu-item" type="button" onclick="openTimerModal()"><i class="fa-solid fa-clock"></i> Hẹn giờ</button>
                        <button class="menu-item" type="button" onclick="openStopwatchModal()"><i class="fa-solid fa-stopwatch"></i> Đếm giờ</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="user-menu">
            <div class="avatar-btn" id="avatarBtn">U</div>
            <div class="dropdown-content" id="userDropdown">
                <div class="dropdown-user-info"><b id="userEmailDisplay">...</b></div>
                <button class="menu-item" onclick="toggleTheme()"><span id="themeText"><i class="fa-solid fa-moon"></i> Chế độ Tối</span></button>
                <button class="menu-item" id="btnLogout" style="color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="class-section">
            <div class="card" style="padding:2rem; margin-bottom:2rem">
                <h2><i class="fa-solid fa-hand-wave"></i> Lớp học của bạn</h2>
                <div style="display:flex; gap:10px; width:100%; max-width:560px; flex-wrap:wrap;">
                    <input type="text" id="className" placeholder="Tên lớp mới..." style="flex:1; min-width:160px;">
                    <select id="classGrade" style="width:140px; padding:14px 12px; border-radius:20px; border:2px solid transparent; background:var(--input-bg); color:var(--text-main); font-weight:600; font-size:0.95rem; cursor:pointer;">
                        <option value="1">Khối 1 (Cấp 1)</option>
                        <option value="2">Khối 2 (Cấp 1)</option>
                        <option value="3">Khối 3 (Cấp 1)</option>
                        <option value="4">Khối 4 (Cấp 1)</option>
                        <option value="5">Khối 5 (Cấp 1)</option>
                        <option value="6">Khối 6 (Cấp 2)</option>
                        <option value="7">Khối 7 (Cấp 2)</option>
                        <option value="8">Khối 8 (Cấp 2)</option>
                        <option value="9">Khối 9 (Cấp 2)</option>
                    </select>
                    <button id="btnAddClass" style="width:auto" type="button">Tạo</button>
                </div>
            </div>
            <div id="class-list" class="grid-classes"></div>
        </div>

        <div id="student-section" class="hidden">
            <button onclick="showClasses()" style="margin-bottom:1rem; background:var(--border); color:var(--text-main); width:auto" type="button">← Trở về</button>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
                <div class="card">
                    <h2 id="current-class-title">...</h2>
                    <div id="random-result" style="font-size:1.6rem; color:var(--primary); font-weight:800; min-height:80px; display:flex; flex-direction:column; justify-content:center; align-items:center;"><i class="fa-solid fa-dice"></i> ???</div>
                    <button id="btnRandom" type="button">Gọi STT ngẫu nhiên</button>
                    <hr style="width:100%; border:0; border-top:1px solid var(--border)">
                    <input type="text" id="stName" placeholder="Tên học sinh">
                    <input type="text" id="stNumber" placeholder="STT">
                    <input type="text" id="stPhone" placeholder="Số điện thoại (tùy chọn)">
                    <button id="btnAddStudent" type="button">Thêm học sinh</button>
                </div>
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:10px;">
                        <h3 style="margin:0;">Danh sách lớp</h3>
                        <button type="button" id="btnExportStudents" class="btn-export" title="Xuất danh sách + điểm + đánh giá AI">
                            <i class="fa-solid fa-file-excel"></i> Xuất file
                        </button>
                    </div>

                    <div id="attendance-stats" class="attendance-stats">
                        <div class="att-stat">
                            <span class="att-stat-label">Sĩ số</span>
                            <span class="att-stat-value" id="statTotal">0</span>
                        </div>
                        <div class="att-stat present">
                            <span class="att-stat-label">Hiện diện</span>
                            <span class="att-stat-value" id="statPresent">0</span>
                        </div>
                        <div class="att-stat absent">
                            <span class="att-stat-label">Vắng</span>
                            <span class="att-stat-value" id="statAbsent">0</span>
                        </div>
                    </div>

                    <div class="attendance-header">
                        <label class="attendance-checkbox-label">
                            <input type="checkbox" id="checkAllAttendance" onchange="toggleCheckAll(this.checked)">
                            <span><b>Có mặt tất cả</b></span>
                        </label>
                    </div>

                    <div id="student-list" style="width:100%"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
