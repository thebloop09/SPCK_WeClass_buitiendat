<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="max-width: 400px; width: 90%;">
        <div class="logo" style="font-size: 2rem;">We<span>Class</span></div>
        <p style="color: var(--text-sub);">Đăng nhập để tiếp tục giảng dạy</p>
        
        <input type="email" id="email" placeholder="Email của bạn">
        <input type="password" id="password" placeholder="Mật khẩu">
        
        <button id="btnLogin">Bắt đầu ngay</button>
        
        <p>Chưa có tài khoản? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Đăng ký</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
